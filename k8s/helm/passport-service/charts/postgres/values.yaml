postgres:
  image:
    repository: postgres
    tag: 12
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: "250m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  port: 5432
  service:
    port: 5432
    targetPort: 5432
    type: ClusterIP
  storage:
    size: 1Gi
    accessModes: ReadWriteOnce